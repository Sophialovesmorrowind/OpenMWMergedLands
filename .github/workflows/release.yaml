name: Build and release

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]
    tags: ['*']

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install repository Rust toolchain
        run: |
          rustup show active-toolchain
          rustc --version --verbose
          cargo --version
          cargo clippy --version
      - name: Cache Cargo dependencies for checks
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: ubuntu-24.04
          cache-bin: "false"
          cache-on-failure: "true"
          # PRs and tags restore the default branch's caches without duplicating them.
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo fmt --check
      - run: cargo clippy --locked --workspace --all-targets --all-features -- -W clippy::pedantic -D warnings
      - run: python3 -m unittest discover -s ci -p 'test_*.py'

  build:
    needs: check
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-amd64
            target: x86_64-unknown-linux-gnu
            runner: ubuntu-24.04
          - platform: linux-arm64
            target: aarch64-unknown-linux-gnu
            runner: ubuntu-24.04-arm
          - platform: macos-amd64
            target: x86_64-apple-darwin
            runner: macos-15-intel
          - platform: macos-arm64
            target: aarch64-apple-darwin
            runner: macos-15
          - platform: windows-amd64
            target: x86_64-pc-windows-msvc
            runner: windows-2022
          - platform: android-arm64
            target: aarch64-linux-android
            runner: ubuntu-24.04
    runs-on: ${{ matrix.runner }}
    env:
      BUILD_TARGET: ${{ matrix.target }}
      BUILD_PLATFORM: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install repository Rust toolchain and build target
        run: |
          rustup show active-toolchain
          rustup target add "$BUILD_TARGET"
          rustc --version --verbose
          cargo --version
      - name: Configure Android linker
        if: matrix.platform == 'android-arm64'
        run: |
          linker="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android23-clang"
          test -x "$linker"
          echo "CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER=$linker" >> "$GITHUB_ENV"
      - name: Cache Cargo dependencies for build target
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          # Separate matrix entries and jobs must be able to save their own artifacts.
          key: ${{ matrix.runner }}-${{ matrix.target }}
          cache-bin: "false"
          cache-on-failure: "true"
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Native tests and CLI smoke check
        if: matrix.platform != 'android-arm64'
        run: |
          cargo test --locked --target "$BUILD_TARGET"
          cargo run --locked --target "$BUILD_TARGET" -- --help
      - run: cargo build --release --locked --target "$BUILD_TARGET"
      - name: Package executable and checksums
        run: python3 ci/package.py "$BUILD_PLATFORM" "$BUILD_TARGET" --version "$GITHUB_REF_NAME"
      - uses: actions/upload-artifact@v7
        with:
          name: merged-lands-${{ matrix.platform }}
          path: dist/*
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: merged-lands-*
          merge-multiple: true
          path: dist
      - name: Verify and publish tagged release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          cd dist
          assets=()
          for platform in linux-amd64 linux-arm64 macos-amd64 macos-arm64 windows-amd64 android-arm64; do
            archive="merged_lands-${platform}.zip"
            test -s "$archive"
            sha256sum --check "${archive}.sha256sum.txt"
            sha512sum --check "${archive}.sha512sum.txt"
            assets+=("$archive" "${archive}.sha256sum.txt" "${archive}.sha512sum.txt")
          done
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "${assets[@]}" --clobber
          else
            gh release create "$RELEASE_TAG" "${assets[@]}" --verify-tag --generate-notes --title "$RELEASE_TAG"
          fi
          gh release view "$RELEASE_TAG" --json assets --jq '.assets[] | select(.size > 0) | .name' > "$RUNNER_TEMP/published-assets.txt"
          for asset in "${assets[@]}"; do
            if ! grep -Fxq "$asset" "$RUNNER_TEMP/published-assets.txt"; then
              echo "::error::Release is missing a nonempty asset: $asset"
              exit 1
            fi
          done
          {
            echo '## Release downloads'
            gh release view "$RELEASE_TAG" --json url --jq .url
            for platform in linux-amd64 linux-arm64 macos-amd64 macos-arm64 windows-amd64 android-arm64; do
              echo "- [$platform](https://github.com/$GH_REPO/releases/download/$RELEASE_TAG/merged_lands-${platform}.zip)"
            done
          } >> "$GITHUB_STEP_SUMMARY"
