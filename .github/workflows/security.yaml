name: Dependency security audit

on:
  workflow_call:
  workflow_dispatch:
  schedule:
    - cron: '17 7 * * *'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install repository Rust toolchain
        run: |
          rustup show active-toolchain
          rustc --version --verbose
      - name: Install cargo-audit
        # Resolve patched dependencies instead of the tool's older published lockfile.
        run: cargo install cargo-audit --version 0.22.2 --no-default-features
      - name: Audit all locked dependencies
        run: cargo audit --deny warnings --json > cargo-audit.json
      - name: Preserve audit report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: cargo-audit
          path: cargo-audit.json
          retention-days: 30
